name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "boards/**"
      - "config/**"
      - "build.yaml"
      - ".github/workflows/build.yml"
    tags-ignore:
      - "*"
  pull_request:
    paths:
      - "boards/**"
      - "config/**"
      - "build.yaml"
      - ".github/workflows/build.yml"

jobs:
  build:
    # Keep the build workflow implementation aligned with the pinned ZMK source.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
