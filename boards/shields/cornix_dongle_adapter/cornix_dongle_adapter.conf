# Cornix USB dongle for the ESB-only split transport.
CONFIG_ZMK_KEYBOARD_NAME="Cornix Dongle"

CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Bluetooth and battery features are excluded from this ESB-only diagnostic build.
CONFIG_ZMK_BATTERY=n
CONFIG_ZMK_BATTERY_NRF_VDDH=n
CONFIG_ZMK_BATTERY_REPORTING=n

CONFIG_PINCTRL=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BACKLIGHT=n

# ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
