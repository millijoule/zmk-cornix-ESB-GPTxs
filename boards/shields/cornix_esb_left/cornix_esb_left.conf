# Left keyboard half: unique ESB peripheral ID 0.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_BATTERY=n
CONFIG_ZMK_BATTERY_NRF_VDDH=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=0
CONFIG_ZMK_BATTERY_REPORTING=n

# Must match the central's radio timing. Pipe 7 remains reserved by the protocol.
CONFIG_ESB_PIPE_COUNT=8
CONFIG_ESB_POLLING_RATE_2KHZ=y
CONFIG_ZMK_SPLIT_ESB_SEND_WHOLE_KEY=n

# Drain radio packets on a dedicated queue, independently of display/UI work.
CONFIG_ZMK_SPLIT_ESB_USE_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_SPLIT_ESB_RX_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
