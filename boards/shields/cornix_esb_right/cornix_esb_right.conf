# Right keyboard half: unique ESB peripheral ID 1.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=1

# ESB RX runs in its own queue; the system workqueue is not shared with radio packet draining.
CONFIG_ZMK_SPLIT_ESB_USE_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_SPLIT_ESB_RX_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48

# Remote battery proxying is BLE-specific in upstream ZMK and is disabled for this ESB setup.
CONFIG_ZMK_BATTERY_REPORTING=n
