# USB central dongle; keyboard halves connect over ESB, not Bluetooth.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_BATTERY_REPORTING=y

# The SDK uses physical pipe 7 for peripheral-to-central traffic; keep eight
# physical ESB pipes, while the SDK patch schedules only the two active halves.
CONFIG_ESB_PIPE_COUNT=8
CONFIG_ESB_POLLING_RATE_2KHZ=y
CONFIG_ZMK_SPLIT_ESB_SEND_WHOLE_KEY=y

# The BLE-only battery proxy is not valid for an ESB-only central in this ZMK revision.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

# Drain radio packets on a dedicated queue, independently of display/UI work.
CONFIG_ZMK_SPLIT_ESB_USE_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_SPLIT_ESB_RX_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
