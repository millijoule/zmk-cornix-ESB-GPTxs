# USB central dongle; keyboard halves connect over ESB, not Bluetooth.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_BATTERY_REPORTING=y

# Do not enable the BLE-only battery proxy for an ESB-only central.
# Current upstream ZMK sizes its proxy array from BLE/Wired transports, not ESB;
# the ESB-only build otherwise creates a zero-length array and risks out-of-bounds writes.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

# Isolate ESB RX handling from display/UI work and provide sufficient stack.
CONFIG_ZMK_SPLIT_ESB_USE_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_SPLIT_ESB_RX_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
